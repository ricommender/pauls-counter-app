<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e19" />
    <meta name="description" content="Pauls Counter – ein Highlight nach dem anderen. Swipe durch Ferien, Feste und coole Termine." />
    <title>Pauls Counter ✳ Swipe zum nächsten Highlight</title>
    <link rel="stylesheet" href="./styles.css?v=3" />
    <script src="./app.js?v=4" defer></script>
  </head>
  <body>
    <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
    <div class="background-glow" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <a href="./" class="brand" aria-label="Pauls Counter – Startseite">
          <span class="brand-symbol" aria-hidden="true">✳</span>
          <span>pauls<span class="brand-light">counter</span><span class="brand-period">.</span></span>
        </a>
        <div class="topbar-right"><span class="live-pulse" aria-hidden="true"></span><span id="today-short">HEUTE</span></div>
      </header>

      <main class="main-content">
        <div class="intro">
          <div>
            <p class="eyebrow"><span aria-hidden="true">✦</span> GOOD TIMES AHEAD</p>
            <h1>Dein nächstes <em>Highlight.</em></h1>
          </div>
          <button class="overview-trigger" type="button" id="open-overview" aria-haspopup="dialog" aria-controls="overview-dialog" aria-label="Alle Termine als Liste anzeigen"><span aria-hidden="true">☷</span><span class="overview-label">Alle Termine</span></button>
        </div>

        <nav class="filter-bar" id="filters" aria-label="Terminkategorie wählen">
          <button type="button" class="filter-pill active" data-filter="event" aria-pressed="true">✨ Highlights</button>
          <button type="button" class="filter-pill" data-filter="all" aria-pressed="false">Alle</button>
          <button type="button" class="filter-pill" data-filter="vacation" aria-pressed="false">🌴 Ferien</button>
          <button type="button" class="filter-pill" data-filter="off" aria-pressed="false">☀️ Schulfrei</button>
        </nav>

        <div class="deck-meta">
          <span class="deck-meta-caption"><span class="tiny-star" aria-hidden="true">✳</span> SWIPE DURCH DEINE TERMINE</span>
          <span class="deck-position" id="deck-position" aria-live="polite">01 / 31</span>
        </div>

        <section class="deck-area" aria-label="Countdown-Karten">
          <div class="swipe-track" id="swipe-track" role="region" aria-roledescription="Karussell" aria-label="Karten chronologisch vom nächsten bis zum letzten Termin" tabindex="0"></div>
        </section>

        <div class="deck-bottom">
          <button type="button" class="deck-arrow" id="prev-card" aria-label="Vorheriger Termin" disabled><span aria-hidden="true">←</span></button>
          <div class="deck-bottom-center">
            <div class="progress-track"><span class="progress-fill" id="progress-fill"></span></div>
            <p id="next-hint" class="next-hint" aria-live="polite">Nach links wischen für mehr →</p>
          </div>
          <button type="button" class="deck-arrow" id="next-card" aria-label="Nächster Termin"><span aria-hidden="true">→</span></button>
        </div>
      </main>
      <footer class="footer"><span>✳ Schuljahr 2026/27 · Nürtingen &amp; Umland</span><a href="https://www.aichtal.de/fileadmin/Dateien/Website/Dateien/Formulare/Betreuung/Ferienplan_NT_2026-2027_genehmigt.pdf" target="_blank" rel="noopener noreferrer">Quelle ↗</a></footer>
    </div>

    <dialog id="overview-dialog" class="overview-dialog" aria-labelledby="overview-title">
      <div class="overview-header">
        <div><p class="eyebrow">DEIN FAHRPLAN</p><h2 id="overview-title">Alle Termine <span>✦</span></h2></div>
        <button id="close-overview" type="button" class="close-dialog" aria-label="Übersicht schließen">×</button>
      </div>
      <p class="overview-description">Chronologisch sortiert – tippe einen Termin an und springe direkt zur Kachel.</p>
      <div class="overview-list" id="overview-list"></div>
    </dialog>
  </body>
</html>
